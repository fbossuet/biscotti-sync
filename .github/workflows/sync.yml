name: Sync Shopify to Webflow
on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-manual]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Check Webflow collection schema
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
        run: |
          curl -s "https://api.webflow.com/v2/collections/69b3969b89ea42246cceef34" \
            -H "Authorization: Bearer $WEBFLOW_TOKEN" \
            -H "accept: application/json"
      - name: Run sync
        env:
          SHOPIFY_DOMAIN: ${{ secrets.SHOPIFY_DOMAIN }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
          WEBFLOW_COLLECTION_ID: ${{ secrets.WEBFLOW_COLLECTION_ID }}
          WEBFLOW_CATEGORIES_COLLECTION_ID: ${{ secrets.WEBFLOW_CATEGORIES_COLLECTION_ID }}
        run: node sync.js ${{ github.event.client_payload.environment || 'staging' }}
