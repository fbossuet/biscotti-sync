# .github/workflows/sync.yml
name: Sync Shopify to Webflow

on:
  schedule:
    # - cron: '*/15 * * * *' # Toutes les 15 minutes (décommente si besoin)
  workflow_dispatch: # Permet de lancer manuellement depuis GitHub
  repository_dispatch: # 🆕 Permet de lancer via API
    types: [trigger-manual]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run sync
        env:
          SHOPIFY_DOMAIN: ${{ secrets.SHOPIFY_DOMAIN }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
          WEBFLOW_COLLECTION_ID: ${{ secrets.WEBFLOW_COLLECTION_ID }}
        run: node sync.js
